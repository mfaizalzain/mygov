name: Update KKM Health Data

on:
  # Runs daily at 00:30 UTC (8:30 AM MYT)
  schedule:
    - cron: '30 0 * * *'
  # Manual trigger so a delayed/skipped cron can be caught up instantly
  workflow_dispatch:

jobs:
  collect-health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check collector
        run: |
          python3 -m py_compile tools/collect_health.py
          echo "syntax OK"

      - name: Run collector (KKM daily series)
        run: |
          python3 tools/collect_health.py

      # Data goes to KV, NOT git - the Worker serves health.json from KV.
      - name: Upload data to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python3 tools/kv_upload.py push
