name: Update KKM Health Data

on:
  # Runs daily at 00:30 UTC (8:30 AM MYT)
  schedule:
    - cron: '30 0 * * *'
  # Manual trigger so a delayed/skipped cron can be caught up instantly
  workflow_dispatch:

jobs:
  collect-health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # SHA-pinned (checkout v5.1.0, setup-python v6.3.0) so a retargeted
        # tag cannot change what runs.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Syntax check collector
        run: |
          python3 -m py_compile tools/collect_health.py
          echo "syntax OK"

      - name: Run collector (KKM daily series)
        run: |
          python3 tools/collect_health.py

      # Only the `health` key - an unfiltered push would re-upload the
      # git-committed copies of the other collectors' files over fresher KV.
      - name: Upload data to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python3 tools/kv_upload.py push health
