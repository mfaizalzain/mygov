name: Update KKM Health Data

on:
  schedule:
    # Runs daily at 00:30 UTC (8:30 AM MYT) — before the trend radar run
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  collect-health:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check collector
        run: |
          python3 -m py_compile tools/collect_health.py
          echo "syntax OK"

      - name: Run collector (KKM daily series)
        run: |
          python3 tools/collect_health.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/health.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: update health.json [skip ci]"
            # Another collector may commit between our commit and push; rebase
            # and retry so concurrent runs never fail on a stale ref.
            for i in 1 2 3; do
              if git push; then break; fi
              git pull --rebase --autostash && git push && break
            done)
