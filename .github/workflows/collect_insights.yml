name: Update Insights + Forecasts

on:
  # Chained to the radar collector rather than scheduled 30 minutes after it.
  # The old '30 1 * * *' assumed radar (01:00) would always land first, but
  # GitHub delivers each cron 1-2.5h late by an independent amount: on 14 Aug
  # radar fired 03:20 and this ran 03:31, an eleven-minute margin that was
  # luck, not design. Whenever the draws inverted, the brief was built from
  # yesterday's radar and nothing said so. workflow_run makes the ordering a
  # guarantee, and the brief inherits radar's ~05:20 MYT slot for free.
  workflow_run:
    workflows: ["Update Trend Radar"]
    types: [completed]
  workflow_dispatch:

jobs:
  collect-insights:
    runs-on: ubuntu-latest
    # A failed radar run leaves radar.json stale, so building a brief on top
    # of it would quietly cite yesterday's issues as today's. Manual dispatch
    # stays unconditional so a bad morning can still be caught up by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - name: Checkout repository
        # SHA-pinned (checkout v5.1.0, setup-python v6.3.0) so a retargeted
        # tag cannot change what runs.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      # Deliberately no statsforecast: the forecast is seasonal-naive with
      # empirical bands, which needs nothing beyond the stdlib. numba + scipy +
      # llvmlite is a slow, fragile install for gains no backtest here has
      # demonstrated. Revisit only if one does.
      - name: Syntax check + unit tests
        run: |
          python3 -m py_compile tools/collect_insights.py
          python3 -m pip install --quiet --disable-pip-version-check pytest
          python3 -m pytest tests/test_forecast.py -q

      # The collector reads the other collectors' output. Those live in KV
      # (refreshed on each collector's schedule); the git-committed copies are
      # only the cold-start fallback and would be stale here - a brief built
      # from the committed files would cite figures a day or more behind.
      # Pull the freshest KV copies first (|| true: if KV is empty on a
      # brand-new namespace the committed fallbacks still work).
      #
      # At this slot (~21:20 UTC) the newest slow.json is its 12:35 UTC run,
      # which carries the last Bank Negara reference of the Malaysian day
      # (17:00 MYT) - the right rate for a brief read the next morning.
      - name: Pull freshest collector data from KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python3 tools/kv_upload.py pull slow public/slow.json || true
          python3 tools/kv_upload.py pull series public/series.json || true
          python3 tools/kv_upload.py pull health public/health.json || true
          python3 tools/kv_upload.py pull prices public/prices.json || true
          python3 tools/kv_upload.py pull radar public/radar.json || true

      - name: Run collector (forecasts + brief)
        run: python3 tools/collect_insights.py

      - name: Validate output
        run: |
          python3 - <<'PY'
          import json, re, sys
          fc = json.load(open('public/forecasts.json'))
          ins = json.load(open('public/insights.json'))
          errs = []
          n = len(fc.get('ridership', {})) + len(fc.get('blood', {}))
          if n == 0:
              errs.append('no forecast series survived the backtest gate')
          for bucket in ('ridership', 'blood'):
              for k, v in (fc.get(bucket) or {}).items():
                  if v['gain'] <= 0.05:
                      errs.append(f'{bucket}/{k} shipped with gain {v["gain"]}')
                  if not all(r['lo'] <= r['mid'] <= r['hi'] for r in v['fc']):
                      errs.append(f'{bucket}/{k} has an unordered band')
          # Nothing forecast here may be a government-set price. If one ever
          # appears, someone bypassed the backtest gate.
          banned = {'ron95', 'ron97', 'diesel', 'usd', 'cpi', 'rice'}
          if banned & (set(fc.get('ridership', {})) | set(fc.get('blood', {}))):
              errs.append('an administered price or FX series was forecast')
          if not isinstance(ins.get('bullets'), list):
              errs.append('insights.bullets is not a list')
          if errs:
              sys.exit('insights: validation failed -> ' + '; '.join(errs))
          print(f"ok: {n} forecast series, {len(ins['bullets'])} bullets, "
                f"{len(ins.get('anomalies', []))} anomalies")
          PY

      # Only these two keys - an unfiltered push would re-upload the
      # git-committed copies of the other collectors' files over fresher KV.
      - name: Upload data to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python3 tools/kv_upload.py push insights forecasts
