name: CI

# Guards that run on every push and PR, as opposed to the collect_*.yml
# workflows which run on a schedule and only exercise their own collector.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # SHA-pinned (checkout v5.1.0) so a retargeted tag cannot change what
        # runs - same convention as the collector workflows.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Need the base commit to diff against; a shallow clone has neither.
          fetch-depth: 0

      # The service worker precaches /index.html, /app.js and /styles.css
      # cache-first and keys the cache on a hand-written VERSION constant. If the shell changes
      # and VERSION does not, every returning visitor keeps running the old
      # build indefinitely and there is no remote lever to pull them off it.
      # That failure mode is silent, permanent, and currently prevented only by
      # remembering - which is what this job replaces.
      - name: Service worker version must be bumped with the app shell
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # Branch creation and the initial push report an all-zero base, and
          # workflow_dispatch reports none at all - nothing to compare against.
          if [ -z "${BEFORE:-}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to diff against - skipping."
            exit 0
          fi

          # Keep this list in step with SHELL_ASSETS in public/sw.js: every
          # precached file that is hand-edited carries the same staleness risk.
          # index.html is precached too, and markup-only changes (an attribute,
          # a new element) used to slip through this gate unbumped.
          changed=$(git diff --name-only "${BEFORE}" HEAD -- \
            public/app.js public/styles.css public/index.html)
          if [ -z "${changed}" ]; then
            echo "App shell unchanged - nothing to check."
            exit 0
          fi

          echo "App shell changed:"
          echo "${changed}" | sed 's/^/  /'

          before_v=$(git show "${BEFORE}:public/sw.js" 2>/dev/null \
            | grep -oE 'const VERSION *= *"[^"]+"' || true)
          after_v=$(grep -oE 'const VERSION *= *"[^"]+"' public/sw.js || true)

          if [ -z "${after_v}" ]; then
            echo "::error file=public/sw.js::Could not find the VERSION constant in public/sw.js."
            exit 1
          fi

          echo "  sw.js VERSION before: ${before_v:-<none>}"
          echo "  sw.js VERSION after:  ${after_v}"

          if [ "${before_v}" = "${after_v}" ]; then
            echo "::error file=public/sw.js::A precached shell file (public/index.html, public/app.js or public/styles.css) changed but public/sw.js VERSION did not. Returning visitors are served the precached shell cache-first, so without a bump they keep running the previous build indefinitely. Bump VERSION (and add a line to the changelog comment above it)."
            exit 1
          fi

          echo "VERSION bumped alongside the shell."

      # Cheap syntax gate. The site ships unbundled, so a syntax error in
      # app.js is not caught by any build step - it just white-screens the
      # page for everyone.
      - name: Syntax-check the Worker and the client
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check public/app.js
          node --check public/sw.js
          echo "syntax OK"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      # Every collector test currently runs only inside its own scheduled
      # workflow, so a change that breaks one is not caught until that
      # collector next fires - up to a day later, in production.
      - name: Run the collector test suite
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pytest pymupdf pandas pyarrow
          python3 -m pytest tests/ -q
