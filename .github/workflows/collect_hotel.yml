name: Update Hotel Survey (quarterly occupancy/room rate)

on:
  schedule:
    # Paid Accommodation Survey publishes ~1 month after each quarter ends
    # (Q1 2026 appeared mid-May 2026); run on the 3rd of Jan/Apr/Jul/Oct.
    - cron: "30 2 3 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pymupdf

      - name: Syntax
        run: python3 -m py_compile tools/collect_hotel.py tools/kv_upload.py

      - name: Collect hotel survey data
        run: python3 tools/collect_hotel.py

      - name: Validate output
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('public/hotel.json'))
          for k in ('aor', 'arr', 'guests'):
              rows = d.get(k) or []
              assert len(rows) == 16, f'{k}: {len(rows)} states, expected 16'
              assert all(r.get('cur') is not None for r in rows), f'{k}: missing cur'
          assert d['asOf']['year'] >= 2024, 'asOf year odd'
          assert d['asOf']['label'], 'missing label'
          print('OK:', d['asOf']['label'], '16 states x', len(d['aor']), 'metrics')
          PY

      - name: Upload data to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python3 tools/kv_upload.py push hotel
