name: Update Car Sales (JPJ registrations)

on:
  schedule:
    # JPJ data refreshes monthly; run a few days in, after the file lands.
    - cron: "30 2 6 * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas pyarrow

      - name: Run unit tests
        run: |
          python3 -m pytest tests/test_cars.py -q

      - name: Collect car sales
        run: |
          python3 tools/collect_cars.py

      - name: Upload data to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python3 tools/kv_upload.py push cars
