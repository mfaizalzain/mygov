name: Update Trend Radar

on:
  # Runs daily at 01:00 UTC (9:00 AM MYT)
  schedule:
    - cron: '0 1 * * *'
  # Manual trigger so a delayed/skipped cron can be caught up instantly
  workflow_dispatch:

# Shares radar.json with the intraday collect_news run — serialise so the two
# can't overwrite each other's payload.
concurrency:
  group: radar-json
  cancel-in-progress: false

jobs:
  collect-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # SHA-pinned (checkout v5.1.0, setup-python v6.3.0) so a retargeted
        # tag cannot change what runs.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Syntax check collector
        run: |
          python3 -m py_compile tools/collect_radar.py
          echo "syntax OK"

      # Pull the 7-day rolling history from KV first so trend persistence
      # survives the switch away from git commits.
      - name: Pull radar history from KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python3 tools/kv_upload.py pull radar_history tools/radar_history.json || echo "no history yet - starting fresh"

      - name: Run collector (Gemini clustering)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python3 tools/collect_radar.py

      # Only the `radar` key (plus history below) - an unfiltered push would
      # re-upload the git-committed copies of the other collectors' files
      # over fresher KV. radar.json feeds the dashboard; the merged history
      # goes back to KV for next run.
      - name: Upload data to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python3 tools/kv_upload.py push radar
          python3 - <<'EOF'
          import os, sys
          sys.path.insert(0, "tools")
          import kv_upload
          kv_upload.put("radar_history", open("tools/radar_history.json", encoding="utf-8").read())
          EOF
