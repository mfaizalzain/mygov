name: Update Trend Radar

on:
  schedule:
    # Runs daily at 01:00 UTC (9:00 AM MYT)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  collect-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytrends

      - name: Run collector
        run: |
          python3 tools/collect_radar.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/radar.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update radar.json [skip ci]" && git push)
