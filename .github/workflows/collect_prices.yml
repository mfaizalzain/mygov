name: Update PriceCatcher Basket Index

on:
  # PriceCatcher's monthly Parquet is rebuilt daily at 12:00 UTC, so run after
  # that: 13:30 UTC = 9:30 PM MYT. Daily, because the current month's file
  # gains a day of prices every day.
  schedule:
    - cron: '30 13 * * *'
  # Manual trigger so a delayed/skipped cron can be caught up instantly
  workflow_dispatch:
    inputs:
      months:
        description: 'Months of history to aggregate (default 13)'
        required: false
        default: '13'

jobs:
  collect-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # SHA-pinned (checkout v5.1.0, setup-python v6.3.0) so a retargeted
        # tag cannot change what runs.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      # The other collectors are stdlib-only. This one cannot be: PriceCatcher
      # is published as Parquet and no stdlib module reads it.
      - name: Install dependencies
        run: pip install --disable-pip-version-check 'pandas~=2.2' 'pyarrow~=21.0'

      - name: Syntax check collector
        run: |
          python3 -m py_compile tools/collect_prices.py
          echo "syntax OK"

      - name: Run collector (PriceCatcher basket index)
        run: |
          python3 tools/collect_prices.py --months "${{ inputs.months || '13' }}"

      # Sanity gate: a silently-empty or wildly-wrong index is worse than a
      # stale one, so refuse to publish rather than overwrite good KV data.
      - name: Validate output
        run: |
          python3 - <<'PY'
          import json, sys, math
          d = json.load(open('public/prices.json'))
          nat = (d.get('basket') or {}).get('national') or []
          partial = d.get('partial')
          errs = []
          if d['basket']['n'] < 80:
              errs.append(f"basket too small: {d['basket']['n']} items")
          # Allow AT MOST one trailing null: the current month is still being
          # collected and is legitimately incomplete (the collector flags it via
          # `partial`). Any null before the end, or more than one, is a real gap.
          real_nat = [v for v in nat if v is not None]
          null_idx = [i for i, v in enumerate(nat) if v is None]
          if len(nat) < 6:
              errs.append(f"index too short: {nat}")
          elif null_idx and null_idx != list(range(len(nat) - len(null_idx), len(nat))):
              errs.append(f"index has internal gaps: {nat}")
          elif len(null_idx) > 1:
              errs.append(f"index has more than one null: {nat}")
          elif not real_nat:
              errs.append(f"index empty: {nat}")
          elif not all(40 < v < 250 for v in real_nat):
              errs.append(f"index out of plausible range: {real_nat}")
          if len(d.get('districts') or {}) < 100:
              errs.append(f"only {len(d.get('districts') or {})} districts")
          if len(d.get('items') or []) < 80:
              errs.append(f"only {len(d.get('items') or [])} items")
          if errs:
              sys.exit('prices: validation failed -> ' + '; '.join(errs))
          last_ok = real_nat[-1] if real_nat else None
          print(f"ok: {d['basket']['n']} items, {len(d['districts'])} districts, "
                f"index {real_nat[0]} -> {last_ok}, asOf {d['asOf']}" +
                (f", partial {partial}" if partial else ""))
          PY

      # Only the `prices` key: an unfiltered push would also re-upload the
      # git-committed slow/health/radar copies over fresher KV values.
      - name: Upload data to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python3 tools/kv_upload.py push prices
