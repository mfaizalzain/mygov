name: Collect Rapid KL Service Alerts

on:
  # Service alerts appear a few times a day; 10 minutes keeps the card fresh
  # without hammering jina's free reader (one request per run, from GitHub's
  # IP pool, which is not rate-limited like Cloudflare Worker egress).
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  collect-rapid:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # SHA-pinned (checkout v5.1.0) so a retargeted tag cannot change what runs.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Syntax check collector
        run: |
          python3 -m py_compile tools/collect_rapid.py
          echo "syntax OK"

      - name: Run collector (latest PULSE alert)
        run: python3 tools/collect_rapid.py

      # Only the `rapid` key - an unfiltered push would re-upload the
      # git-committed copies of the other collectors' files over fresher KV.
      - name: Upload data to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python3 tools/kv_upload.py push rapid
