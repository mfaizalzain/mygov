name: Collect Live Traffic

on:
  schedule:
    # Every 15 minutes. The frontend drops any post older than two hours - the
    # same rule the TomTom layer follows - so a 15-minute collection gap is
    # invisible against that window, while */5 was 288 scrapes a day of a
    # Telegram channel that posts a few dozen times.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect traffic posts
        run: python3 tools/collect_traffic.py

      - name: Validate output
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('public/traffic.json'))
          posts = d.get('posts') or []
          assert posts, 'no posts collected'
          assert all(p.get('text') and p.get('ts') for p in posts), 'post missing text/ts'
          assert all(p.get('url') for p in posts), 'post missing url'
          print('OK:', len(posts), 'posts | newest ts:', posts[0]['time'])
          PY

      - name: Upload data to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python3 tools/kv_upload.py push traffic
