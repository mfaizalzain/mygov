name: Update Slow Data (fuel, finance, mobility, economy, population)

on:
  # Runs four times a day, just after each Bank Negara reference rate lands
  # (09:35 / 12:35 / 17:35 / 20:35 MYT), so the FX hero stays on the newest
  # published snapshot instead of showing the 12:00 rate all day. The other
  # business-daily series (FPX, ridership) only get fresher for it.
  schedule:
    - cron: '35 1 * * *'
    - cron: '35 4 * * *'
    - cron: '35 9 * * *'
    - cron: '35 12 * * *'
  # Manual trigger so a delayed/skipped cron can be caught up instantly
  workflow_dispatch:

jobs:
  collect-slow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # SHA-pinned (checkout v5.1.0, setup-python v6.3.0) so a retargeted
        # tag cannot change what runs.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Syntax check collector
        run: |
          python3 -m py_compile tools/collect_slow.py
          echo "syntax OK"

      - name: Run collector (non-real-time datasets)
        run: |
          python3 tools/collect_slow.py

      - name: Build SEO snapshot + feed
        run: python3 tools/embed_seo.py

      # Only the keys this job regenerated (slow.json, feed.xml, seo_snap) -
      # an unfiltered push would re-upload the git-committed copies of the
      # other collectors' files over fresher KV. The Worker serves
      # slow.json/feed.xml and splices the SEO snapshot at request time.
      - name: Upload data to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python3 tools/kv_upload.py push slow series feed --snap
