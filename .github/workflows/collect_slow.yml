name: Update Slow Data (fuel, finance, mobility, economy, population)

on:
  # Runs twice daily so the business-daily series (FX, FPX, ridership) stay
  # within ~12h of current: 08:30 AM + 08:30 PM MYT
  schedule:
    - cron: '30 0 * * *'
    - cron: '30 12 * * *'
  # Catch-up: also refresh on any push, so a delayed/skipped cron never
  # leaves the static files stale for a day. The collector's own commit uses
  # [skip ci], so this cannot loop.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  collect-slow:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check collector
        run: |
          python3 -m py_compile tools/collect_slow.py
          echo "syntax OK"

      - name: Run collector (non-real-time datasets)
        run: |
          python3 tools/collect_slow.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/slow.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: update slow.json [skip ci]"
            # Another collector may commit between our commit and push; rebase
            # and retry so concurrent runs never fail on a stale ref.
            for i in 1 2 3; do
              if git push; then break; fi
              git pull --rebase --autostash && git push && break
            done)
