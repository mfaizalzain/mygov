name: Collect FIDS Boards

on:
  schedule:
    # Every 10 minutes - flight boards change continuously
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect all FIDS boards
        env:
          FIDS_API_KEY: ${{ secrets.FIDS_API_KEY }}
        run: |
          python3 tools/collect_fids.py || true
          # Fail soft: a partial board (some airports erroring) is still
          # better than none - the Worker falls back to live fetch per-board.

      - name: Validate output
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('public/fids.json'))
          boards = d.get('boards') or {}
          assert boards, 'no boards collected'
          klia = {k: boards[k] for k in ('A|KLIA', 'D|KLIA') if k in boards}
          assert klia, 'no KLIA board collected'
          for k, b in klia.items():
              n = len(b.get('flights') or [])
              # A truncated board must never replace a complete one in KV -
              # the Worker refuses to serve truncated boards anyway.
              assert not b.get('truncated'), f'{k} truncated: {n}/{b.get("count")}'
              assert n >= (b.get('count') or 0), f'{k} incomplete: {n}/{b.get("count")}'
          print('OK:', len(boards), 'boards | KLIA A:',
                len(boards.get('A|KLIA', {}).get('flights', [])), 'flights')
          PY

      - name: Upload data to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python3 tools/kv_upload.py push fids
