name: Update Election Results (SPR, latest per category)

on:
  # Elections are irregular; run manually after a PRU/state election/by-election.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax
        run: python3 -m py_compile tools/collect_election.py tools/kv_upload.py

      - name: Collect election results
        run: python3 tools/collect_election.py

      - name: Validate output
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('public/election.json'))
          seats = d.get('seats') or []
          assert len(seats) >= 200, f'only {len(seats)} seats - crawl incomplete?'
          cats = d.get('categories') or {}
          assert cats.get('pru') and cats.get('dun') and cats.get('prk'), 'missing a category'
          assert all(s.get('candidates') for s in seats), 'seat with no candidates'
          assert all(any(c.get('isWinner') for c in s['candidates']) for s in seats), 'seat with no winner'
          print('OK:', len(seats), 'seats |', cats['pru']['name'], '/', cats['dun']['name'], '/', cats['prk']['name'])
          PY

      - name: Upload data to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python3 tools/kv_upload.py push election
