name: Update Election Results (SPR, latest per category)

on:
  # Elections are irregular; run manually after a PRU/state election/by-election.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax
        run: python3 -m py_compile tools/collect_election.py tools/kv_upload.py

      - name: Collect election results
        run: python3 tools/collect_election.py

      - name: Validate output
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('public/election.json'))
          seats = d.get('seats') or []
          assert len(seats) >= 600, f'only {len(seats)} seats - crawl incomplete?'
          cats = d.get('categories') or {}
          assert cats.get('pru') and cats.get('dun') and cats.get('prk'), 'missing a category'
          dun_states = set(s['state'] for s in seats if s['category'] == 'dun')
          assert len(dun_states) == 13, f'{len(dun_states)} states with DUN results, expected 13'
          # Allow seats whose election was postponed (Pahang N.42 Tioman, 2022 -
          # candidate died; SPR returns no candidates at all)
          empty = [s['name'] for s in seats if not s.get('candidates')]
          noresult = [s['name'] for s in seats if s.get('candidates') and not any(c.get('isWinner') for c in s['candidates'])]
          assert len(empty) + len(noresult) <= 2, f'bad seats: {empty + noresult}'
          print('OK:', len(seats), 'seats |', cats['pru']['name'], '/', len(dun_states), 'states DUN /', cats['prk']['name'])
          PY

      - name: Upload data to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python3 tools/kv_upload.py push election
